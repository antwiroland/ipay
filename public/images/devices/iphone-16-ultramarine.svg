<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-label="iPhone 16 in Ultramarine">
  <defs>
    <linearGradient id="backultram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#778bf2"/><stop offset=".55" stop-color="#5b6fd6"/><stop offset="1" stop-color="#3549b0"/>
    </linearGradient>
    <linearGradient id="sheenultram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenultram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8397fe"/><stop offset=".5" stop-color="#475bc2"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glassultram" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#3b4a6b"/><stop offset=".6" stop-color="#111522"/><stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="ringultram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b8ff6"/><stop offset="1" stop-color="#2b3fa6"/>
    </linearGradient>
    <filter id="shadowultram" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="330" cy="560" rx="230" ry="16" fill="#0b1220" opacity=".08"/>
  <g filter="url(#shadowultram)">
    <!-- front -->
    <g transform="translate(-6 30) rotate(-6 200 320)">
      <rect x="110" y="70" width="220" height="460" rx="40" fill="#495dc4"/>
      <rect x="118" y="78" width="204" height="444" rx="33" fill="#05070c"/>
      <rect x="126" y="86" width="188" height="428" rx="27" fill="url(#screenultram)"/>
      <rect x="186" y="98" width="68" height="20" rx="10" fill="#05070c"/>
      <text x="220" y="210" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="300" fill="#fff" opacity=".92">9:41</text>
      <text x="220" y="238" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" opacity=".7">Monday, 19 October</text>
    </g>
    <!-- back -->
    <g transform="rotate(5 410 300)">
      <rect x="300" y="70" width="220" height="460" rx="40" fill="#495dc4"/>
      <rect x="305" y="75" width="210" height="450" rx="36" fill="url(#backultram)"/>
      <rect x="305" y="75" width="210" height="450" rx="36" fill="url(#sheenultram)"/>
      <rect x="318" y="88" width="92" height="92" rx="26" fill="#677be2" stroke="#3549b0" stroke-opacity=".35"/>
      
    <circle cx="348" cy="114" r="20" fill="url(#ringultram)"/>
    <circle cx="348" cy="114" r="15" fill="#0b0d12"/>
    <circle cx="348" cy="114" r="9.3" fill="url(#glassultram)"/>
    <circle cx="343.8" cy="109.5" r="2.4" fill="#ffffff" opacity="0.35"/>
    <circle cx="348" cy="154" r="20" fill="url(#ringultram)"/>
    <circle cx="348" cy="154" r="15" fill="#0b0d12"/>
    <circle cx="348" cy="154" r="9.3" fill="url(#glassultram)"/>
    <circle cx="343.8" cy="149.5" r="2.4" fill="#ffffff" opacity="0.35"/>
      <circle cx="388" cy="112" r="5" fill="#f5e7c8" opacity=".8"/>
    </g>
  </g>
</svg>